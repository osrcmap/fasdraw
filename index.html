<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fasdraw</title>
<meta name="description" content="Keyboard-first C4 diagramming">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root {
  --bg: #ffffff; --fg: #1e1e24; --muted: #6b6b76; --card: #ffffff; --line: #e6e6ec; --hover: #f1f0ff;
  --accent: #6965db; --accent-bg: #e0dfff; --dot: #d8d8e0;
  --shadow: 0 0 0 1px rgb(0 0 0 / .05), 0 4px 16px rgb(0 0 0 / .07);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #121214; --fg: #e3e3e8; --muted: #9a9aa5; --card: #232329; --line: #36363f; --hover: #2f2e40;
  --accent: #a8a5ff; --accent-bg: #3d3b6b; --dot: #2c2c33;
  --shadow: 0 0 0 1px rgb(255 255 255 / .06), 0 4px 16px rgb(0 0 0 / .45);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
#cv { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; background-image: radial-gradient(circle, var(--dot) 1px, transparent 1.5px); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
kbd { display: inline-block; font: 600 10.5px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; padding: 3px 5px; border-radius: 4px; background: var(--hover); color: var(--muted); }
kbd + kbd { margin-left: 3px; }
code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--hover); padding: 1px 4px; border-radius: 4px; }
.card { position: fixed; background: var(--card); border-radius: 10px; box-shadow: var(--shadow); }

#tools { top: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 2px; padding: 4px; max-width: calc(100vw - 120px); overflow-x: auto; scrollbar-width: none; }
.btn { position: relative; flex: none; width: 38px; height: 38px; display: grid; place-items: center; border-radius: 8px; }
.btn:hover { background: var(--hover); }
.btn.on { background: var(--accent-bg); color: var(--accent); }
.btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-linejoin: round; stroke-linecap: round; }
.btn kbd { position: absolute; right: 2px; bottom: 1px; padding: 0; background: none; font-size: 9px; font-weight: 500; }
.sep { flex: none; width: 1px; margin: 8px 4px; background: var(--line); }

#menu-btn { position: fixed; top: 12px; left: 12px; }
#menu { top: 58px; left: 12px; z-index: 3; width: 260px; padding: 6px; max-height: calc(100vh - 80px); overflow: auto; }
#menu button, #help button { display: flex; width: 100%; justify-content: space-between; align-items: center; gap: 12px; padding: 6px 8px; border-radius: 6px; text-align: left; }
#menu button:hover, #help button:hover { background: var(--hover); }
.grp { padding: 8px 8px 2px; font-size: 11px; color: var(--muted); }

#props { top: 58px; left: 12px; width: 200px; padding: 2px 12px 12px; }
#props h4 { display: flex; justify-content: space-between; align-items: center; margin: 10px 0 6px; font-size: 11px; font-weight: 500; color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 4px; }
.sw { width: 22px; height: 22px; border-radius: 6px; box-shadow: inset 0 0 0 1px rgb(0 0 0 / .12); }
.sw.auto { background: conic-gradient(#08427b 0 25%, #1168bd 0 50%, #438dd5 0 75%, #85bbf0 0); }
.sw.on { outline: 2px solid var(--accent); outline-offset: 2px; }
.opt { display: grid; place-items: center; height: 28px; flex: 1; border-radius: 6px; background: var(--hover); color: var(--muted); }
.opt:hover { color: var(--fg); }
.opt.on { background: var(--accent-bg); color: var(--accent); }
.opt.wide { display: flex; justify-content: space-between; padding: 0 8px; }
.opt svg { width: 28px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

#status { position: fixed; left: 12px; bottom: 12px; display: flex; gap: 12px; align-items: center; font-size: 12px; color: var(--muted); pointer-events: none; }
.mode { font: 700 10.5px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .05em; padding: 5px 8px; border-radius: 5px; color: #fff; background: var(--accent); }
.mode.INSERT { background: #2f9e44; }
.mode.LEADER { background: #e8590c; }
#hint { position: fixed; right: 12px; bottom: 12px; font-size: 12px; color: var(--muted); }
#toast { bottom: 52px; left: 50%; transform: translateX(-50%); padding: 8px 14px; }
#whichkey { bottom: 52px; left: 50%; transform: translateX(-50%); padding: 12px 16px; min-width: 320px; }
#whichkey .path { margin-bottom: 10px; }
#whichkey .grid { display: grid; grid-template-columns: auto 1fr auto 1fr; gap: 6px 10px; align-items: center; }

#editor { position: fixed; z-index: 2; resize: none; overflow: hidden; border: 0; outline: 0; padding: 8px 10px; border-radius: 8px; font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--fg); background: var(--card); box-shadow: var(--shadow), 0 0 0 2px var(--accent); }
#editor::placeholder { color: var(--muted); }

#help { top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 4; width: min(820px, calc(100vw - 24px)); max-height: calc(100vh - 48px); overflow: auto; padding: 6px 22px 20px; }
#help h2 { font-size: 16px; margin: 14px 0 4px; }
#help .cols { columns: 2 300px; column-gap: 32px; }
#help h3 { break-after: avoid; margin: 16px 0 6px; font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
#help p { margin: 0; color: var(--muted); break-inside: avoid; }
#help button { padding: 4px 0; }
.kv { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; break-inside: avoid; }

#empty { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: max-content; max-width: calc(100vw - 32px); text-align: center; color: var(--muted); pointer-events: none; line-height: 2.3; }
#empty h1 { margin: 0 0 6px; font-size: 30px; letter-spacing: -.02em; color: var(--fg); }

@media (max-width: 720px) {
  #tools { top: auto; bottom: 48px; max-width: calc(100vw - 24px); }
  #hint { display: none; }
  #props { width: 172px; }
}
</style>
</head>
<body>
<canvas id="cv" aria-label="Diagram canvas"></canvas>
<div id="empty">
  <img src="/favicon.svg" alt="" width="56" height="56">
  <h1>fasdraw</h1>
  <div>Hover the canvas and press a shape key to drop it there</div>
  <div><kbd>p</kbd> person &nbsp;<kbd>s</kbd> system &nbsp;<kbd>c</kbd> container &nbsp;<kbd>d</kbd> database &nbsp;<kbd>q</kbd> queue</div>
  <div><kbd>Tab</kbd> or <kbd>H</kbd><kbd>J</kbd><kbd>K</kbd><kbd>L</kbd> grow a connected node · <kbd>Space</kbd> commands · <kbd>?</kbd> all keys</div>
</div>
<button class="card btn" id="menu-btn" title="Menu" aria-label="Menu"><svg viewBox="0 0 24 24" stroke-width="1.8"><path d="M5 7h14M5 12h14M5 17h14"/></svg></button>
<nav class="card" id="menu" hidden></nav>
<div class="card" id="tools" role="toolbar" aria-label="Shapes"></div>
<div class="card" id="props" hidden></div>
<div id="status"></div>
<div id="hint"><kbd>Space</kbd> commands · <kbd>?</kbd> keys</div>
<div class="card" id="whichkey" hidden></div>
<div class="card" id="toast" role="status" hidden></div>
<div class="card" id="help" hidden></div>
<textarea id="editor" rows="1" spellcheck="false" hidden placeholder="Name [tech]   ⇧⏎ description"></textarea>
<input type="file" id="file" accept=".fasdraw,.json,.dsl" hidden>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
